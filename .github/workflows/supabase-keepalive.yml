# Mantém o projeto do Supabase acordado.
#
# O plano gratuito do Supabase pausa o projeto depois de alguns dias sem
# nenhuma requisição. Projeto pausado significa: login do /admin não funciona
# e o formulário de contato do site não grava lead nenhum — perde-se o cliente
# sem ninguém perceber.
#
# Roda todo dia, não toda semana: a janela de inatividade do plano gratuito é
# de poucos dias e uma falha de uma única execução semanal já deixaria o
# projeto pausar.
#
# Isto NÃO reativa um projeto já pausado — isso é um clique no painel do
# Supabase. Aqui só se evita que ele pause de novo.

name: Supabase keepalive

on:
  schedule:
    # 11:10 UTC = 08:10 em Brasília. Minuto quebrado de propósito: horários
    # redondos são os mais concorridos no agendador do GitHub e sofrem atraso.
    - cron: '10 11 * * *'
  # Permite disparar à mão na aba Actions, útil para testar o segredo.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar a tabela de artigos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Faltam os segredos SUPABASE_URL e/ou SUPABASE_ANON_KEY no repositório."
            echo "Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

          # Uma leitura real, mínima: a tabela existe e a política de leitura
          # pública responde. `limit=1` para não trafegar os artigos inteiros.
          #
          # Três tentativas, porque o projeto hibernando faz a PRIMEIRA
          # requisição falhar enquanto o banco sobe — comportamento medido, não
          # suposto. Sem repetir, este fluxo mandaria e-mail de falha toda vez
          # que acordasse o projeto, que é justamente quando ele funcionou.
          for tentativa in 1 2 3; do
            # `|| true` e não `|| echo 000`: em caso de falha o próprio curl
            # já imprime 000 por causa do -w, e o echo gerava "000000" no log.
            # O `|| true` existe só para o set -e não abortar o laço.
            status=$(curl -sS -m 30 -o /tmp/resposta.txt -w '%{http_code}'               -H "apikey: ${SUPABASE_ANON_KEY}"               -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"               "${SUPABASE_URL}/rest/v1/blog_posts?select=slug&limit=1" || true)

            echo "Tentativa ${tentativa}: HTTP ${status}"

            if [ "${status}" = "200" ]; then
              echo "Supabase respondeu normalmente."
              exit 0
            fi

            # 4xx é configuração errada (chave, tabela, política de leitura).
            # Repetir não resolve, então falha logo com a mensagem útil.
            if [ "${status}" -ge 400 ] 2>/dev/null && [ "${status}" -lt 500 ]; then
              echo "Resposta do Supabase:"
              cat /tmp/resposta.txt
              echo
              echo "HTTP ${status} indica chave ou permissão incorreta —"
              echo "confira os segredos e a política de leitura de blog_posts."
              exit 1
            fi

            if [ "${tentativa}" -lt 3 ]; then
              echo "Aguardando o banco subir..."
              sleep 15
            fi
          done

          echo "Resposta do Supabase:"
          cat /tmp/resposta.txt
          echo
          echo "Sem resposta depois de 3 tentativas. O projeto provavelmente está"
          echo "pausado e precisa ser reativado à mão em https://supabase.com/dashboard"
          exit 1
